/* Letter video + final scratch-card page */
.letter-video-page{width:min(100%,390px);max-height:calc(100svh - 40px);overflow-y:auto;padding:22px 18px 26px;border-radius:30px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.16);text-align:center;animation:cardIn .55s ease both}
.letter-video-wrap{width:100%;border-radius:22px;overflow:hidden;background:#15121a;box-shadow:0 18px 40px rgba(50,35,55,.2);margin:12px auto 16px}
.letter-video-wrap video{display:block;width:100%;max-height:68svh;object-fit:contain;background:#000}
.letter-video-note{font-size:13px;color:#756b7d;margin:0}
.letter-content{font-size:14px;line-height:1.7;color:#4e4655;text-align:left;padding:4px 2px 12px}
.letter-content .letter-head{text-align:left;font-family:'Playfair Display',serif;font-size:25px;line-height:1.25;margin:0 0 16px;color:#4a3d4e}
.letter-content p{margin:0 0 13px}
.letter-content .poem{white-space:pre-line;margin:10px 0 18px;padding:16px 14px;border-radius:18px;background:linear-gradient(145deg,rgba(255,248,252,.95),rgba(246,241,255,.9));box-shadow:inset 0 0 0 1px rgba(160,125,160,.12)}
.letter-content .sign{text-align:right;margin-top:18px}
.final-photo-page{width:min(100%,430px);max-height:calc(100svh - 40px);overflow-y:auto;padding:28px 18px 32px;border-radius:32px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.16);text-align:center;animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}
.final-photo-title{font-family:'Playfair Display',serif;font-size:27px;line-height:1.25;margin:0 auto 20px}
.final-photo-frame{position:relative;width:min(100%,310px);margin:0 auto 18px;padding:12px;border:9px solid #29222e;border-radius:26px;background:linear-gradient(145deg,#5c4c61,#17131b);box-shadow:0 24px 50px rgba(43,29,48,.25),inset 0 0 0 2px rgba(255,255,255,.12);transform:perspective(900px) rotateY(-4deg);animation:frameReveal .9s cubic-bezier(.2,.8,.2,1) both}
.final-photo-frame:before{content:'SAKSHI • MEMORY';position:absolute;left:16px;top:14px;z-index:4;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.52);color:#fff;font-size:9px;letter-spacing:1.2px;font-weight:700}
.final-photo-frame img{display:block;width:100%;height:390px;object-fit:cover;border-radius:15px;background:#eee}
@keyframes frameReveal{0%{opacity:0;transform:perspective(900px) rotateY(-18deg) rotateZ(-2deg) scale(.82)}100%{opacity:1;transform:perspective(900px) rotateY(-4deg) rotateZ(0) scale(1)}}
.scratch-title{font-family:'Playfair Display',serif;font-size:26px;line-height:1.3;margin:0 auto 7px}
.scratch-sub{font-size:14px;line-height:1.55;color:#756b7d;margin:0 auto 18px}
.scratch-wrap{position:relative;width:min(100%,320px);height:410px;margin:0 auto 18px;border-radius:22px;overflow:hidden;border:8px solid #29222e;background:#f5f1f5;box-shadow:0 22px 48px rgba(55,40,60,.22);touch-action:none}
.scratch-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
.scratch-message{position:absolute;left:14px;right:14px;top:16px;z-index:5;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:0 10px 28px rgba(55,40,60,.15);font-family:'Playfair Display',serif;font-size:21px;line-height:1.25;color:#4d3d50;opacity:0;transform:translateY(-18px) scale(.92);pointer-events:none}
.scratch-message.reveal{animation:scratchReveal .85s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes scratchReveal{0%{opacity:0;transform:translateY(-18px) scale(.92)}65%{opacity:1;transform:translateY(5px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
.scratch-hint{font-size:12px;color:#806a86;margin:0}
.scratch-complete #scratchCanvas{pointer-events:none;animation:scratchFade .45s ease forwards}
@keyframes scratchFade{to{opacity:0}}
@media(max-width:480px){.final-photo-frame img{height:360px}.scratch-wrap{height:370px}.scratch-message{font-size:19px}.letter-video-page{padding-left:14px;padding-right:14px}}

/* Page 7 — live camera */
.camera-live-card{width:min(100%,390px)!important;padding:28px 18px 24px!important}
.smile-title{font-family:'Playfair Display',serif;font-size:32px;line-height:1.15;margin:0 auto 18px;animation:smileTitleIn .75s cubic-bezier(.2,.8,.2,1) both}
.camera-live-wrap{position:relative;width:min(100%,340px);aspect-ratio:4/5;margin:0 auto 18px;border-radius:28px;padding:10px;background:linear-gradient(145deg,#5a4d61,#17131b);box-shadow:0 22px 48px rgba(43,29,48,.26),inset 0 0 0 2px rgba(255,255,255,.12);overflow:hidden;animation:cameraLiveIn .8s cubic-bezier(.2,.8,.2,1) both}
.camera-live-wrap video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:20px;background:#17131b;transform:scaleX(-1)}
.camera-live-wrap:before{content:'LIVE CAMERA';position:absolute;left:18px;top:18px;z-index:3;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.52);color:#fff;font-size:9px;letter-spacing:1.15px;font-weight:700}
.camera-live-wrap:after{content:'';position:absolute;left:20px;bottom:20px;width:9px;height:9px;border-radius:50%;background:#ff4d68;box-shadow:0 0 10px #ff4d68;z-index:3;animation:recordDot 1s infinite}
.camera-status{font-size:12px;line-height:1.45;color:#756b7d;margin:0 auto 14px;min-height:18px}
.camera-click-btn{width:min(100%,220px)!important;flex:0 0 auto!important}
@keyframes smileTitleIn{0%{opacity:0;transform:translateY(24px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes cameraLiveIn{0%{opacity:0;transform:translateY(22px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}

/* Page 8 — scratch photo */
.scratch-result-title{font-family:'Playfair Display',serif;font-size:27px;line-height:1.28;margin:0 auto 18px;color:#4a3d4e;animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}
.scratch-frame{position:relative;width:min(100%,330px);margin:0 auto 18px;padding:10px;border-radius:28px;background:linear-gradient(145deg,#5f5063,#1c1720);box-shadow:0 24px 52px rgba(43,29,48,.26),inset 0 0 0 2px rgba(255,255,255,.12),inset 0 0 0 7px rgba(255,255,255,.05);transform:perspective(900px) rotateY(-3deg);animation:scratchFrameIn .8s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.scratch-frame:before{content:'SAKSHI • ORIGINAL';position:absolute;left:18px;top:18px;z-index:7;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.52);color:#fff;font-size:9px;letter-spacing:1.2px;font-weight:700}
.scratch-frame:after{content:'';position:absolute;inset:7px;border:1px solid rgba(255,255,255,.16);border-radius:22px;pointer-events:none;z-index:6}
.scratch-frame .scratch-wrap{width:100%;height:410px;margin:0;border:0;border-radius:20px;box-shadow:none}
.scratch-frame .scratch-wrap img{object-fit:cover}
.scratch-frame .scratch-message{display:none!important}
.scratch-revealed .scratch-frame{animation:scratchRevealFrame .7s cubic-bezier(.2,.8,.2,1) both}
.scratch-revealed .scratch-result-title{animation:revealResult .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes scratchFrameIn{0%{opacity:0;transform:perspective(900px) rotateY(-12deg) scale(.9)}100%{opacity:1;transform:perspective(900px) rotateY(-3deg) scale(1)}}
@keyframes scratchRevealFrame{0%{transform:perspective(900px) rotateY(-3deg) scale(1)}50%{transform:perspective(900px) rotateY(2deg) scale(1.03)}100%{transform:perspective(900px) rotateY(0) scale(1)}}
@keyframes revealResult{0%{opacity:0;transform:translateY(12px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){.camera-live-wrap{width:min(100%,320px)}.scratch-frame .scratch-wrap{height:370px}.scratch-result-title{font-size:24px}}


/* Page 8 -> Letter / Page 9 */
.scratch-next-wrap{display:flex;justify-content:center;margin-top:14px}
.scratch-next-btn{width:min(100%,220px)!important;flex:0 0 auto!important}
.letter-page-only{width:min(100%,390px)!important;max-height:calc(100svh - 40px)!important;overflow:auto!important;padding:28px 20px 30px!important;text-align:center!important;border-radius:30px!important;background:rgba(255,255,255,.84)!important;backdrop-filter:blur(18px)!important;box-shadow:0 24px 70px rgba(89,65,105,.14)!important;animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}
.letter-page-only .success-title{margin-bottom:24px}
.letter-envelope-only{width:250px;height:175px;margin:0 auto;position:relative;cursor:pointer;perspective:1000px;animation:letterFloat 2.5s ease-in-out infinite;filter:drop-shadow(0 18px 28px rgba(89,65,105,.18))}
.letter-envelope-only .letter-envelope-back{position:absolute;left:12px;right:12px;bottom:8px;height:142px;border-radius:12px;background:linear-gradient(145deg,#fffdf9,#efe3ef);box-shadow:inset 0 0 0 1px rgba(140,110,140,.08);overflow:hidden}
.letter-envelope-only .letter-envelope-back:before{content:'';position:absolute;inset:0;background:linear-gradient(35deg,transparent 49%,rgba(180,150,180,.18) 50%,transparent 51%),linear-gradient(145deg,transparent 49%,rgba(180,150,180,.12) 50%,transparent 51%);opacity:.65}
.letter-envelope-only .letter-paper-preview{position:absolute;left:28px;right:28px;top:42px;height:104px;border-radius:9px;background:#fffdf7;box-shadow:0 6px 18px rgba(70,50,70,.12);z-index:2;transform:translateY(22px);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.letter-envelope-only .letter-paper-preview:before,.letter-envelope-only .letter-paper-preview:after{content:'';position:absolute;left:18px;right:18px;height:2px;background:#d9cbd8;border-radius:2px;opacity:.65}
.letter-envelope-only .letter-paper-preview:before{top:28px}.letter-envelope-only .letter-paper-preview:after{top:44px}
.letter-envelope-only .envelope-fold-left,.letter-envelope-only .envelope-fold-right{position:absolute;bottom:8px;width:0;height:0;border-style:solid;z-index:3}
.letter-envelope-only .envelope-fold-left{left:12px;border-width:0 113px 92px 0;border-color:transparent #f1e5ef transparent transparent}
.letter-envelope-only .envelope-fold-right{right:12px;border-width:92px 113px 0 0;border-color:#eadbe8 transparent transparent transparent}
.letter-envelope-only .envelope-flap-only{position:absolute;left:12px;right:12px;top:28px;height:104px;clip-path:polygon(0 0,50% 100%,100% 0);background:linear-gradient(145deg,#e7cfe0,#f6e8f1);transform-origin:top;transition:transform .8s cubic-bezier(.2,.8,.2,1);z-index:4;border-top-left-radius:12px;border-top-right-radius:12px}
.letter-envelope-only.is-opening .envelope-flap-only{transform:rotateX(180deg)}
.letter-envelope-only.is-opening .letter-paper-preview{transform:translateY(-28px)}
.letter-seal{position:absolute;left:50%;top:88px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#b86f93,#806a9a);color:#fff;font-size:16px;z-index:6;box-shadow:0 6px 16px rgba(90,60,100,.2);transition:opacity .35s,transform .5s}
.letter-envelope-only.is-opening .letter-seal{opacity:0;transform:translateX(-50%) scale(.6)}
.letter-tap{font-size:13px;color:#766b7d;margin:18px 0 0}
.letter-video-full{position:fixed;inset:0;z-index:100;background:rgba(18,14,22,.96);display:grid;place-items:center;padding:18px;animation:videoPageIn .45s ease both}
.letter-video-full video{width:100%;height:100%;max-width:1100px;max-height:100%;object-fit:contain;background:#000;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.4)}
.letter-dialog-backdrop{position:fixed;inset:0;z-index:110;background:rgba(31,23,36,.62);backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;animation:dialogBackdropIn .35s ease both}
.letter-dialog{position:relative;width:min(100%,760px);max-height:min(92svh,900px);overflow:auto;border-radius:28px;background:linear-gradient(145deg,#fffdf9,#f7eff9 54%,#eef4ff);box-shadow:0 30px 90px rgba(30,20,35,.32);padding:22px 20px 28px;animation:dialogIn .55s cubic-bezier(.2,.8,.2,1) both}
.letter-dialog-close{position:sticky;top:0;float:right;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:0 8px 20px rgba(70,50,70,.12);font:700 18px 'DM Sans',sans-serif;color:#5b4c60;cursor:pointer;z-index:5;display:grid;place-items:center}
.letter-dialog-title{clear:both;font-family:'Playfair Display',serif;font-size:34px;line-height:1.15;text-align:center;margin:8px auto 22px;color:#4a3d4e}
.letter-dialog-paper{position:relative;margin:0 auto;width:min(100%,650px);padding:28px 24px 26px;border-radius:24px;background:#fffdf8;box-shadow:0 12px 34px rgba(70,50,70,.12),inset 0 0 0 1px rgba(160,125,160,.11);text-align:left}
.letter-dialog-paper:before{content:'LETTER';position:absolute;top:14px;right:16px;font-size:9px;font-weight:700;letter-spacing:1.5px;color:#b08da9}
.letter-dialog .letter-content{font-size:15px;line-height:1.75;color:#4e4655;text-align:left;padding:4px 0 10px}
.letter-dialog .letter-content .poem{white-space:pre-line;margin:12px 0 20px;padding:18px 16px;border-radius:18px;background:linear-gradient(145deg,rgba(255,248,252,.96),rgba(246,241,255,.92));box-shadow:inset 0 0 0 1px rgba(160,125,160,.12)}
.letter-dialog .letter-content p{margin:0 0 14px}
.letter-dialog .letter-content .sign{text-align:right;margin-top:20px}
.letter-dialog-gift-wrap{display:flex;justify-content:center;margin-top:12px;padding-top:8px}
.letter-dialog-gift{font-size:42px;line-height:1;cursor:pointer;animation:giftBounceLarge 1.15s infinite;filter:drop-shadow(0 7px 14px rgba(90,60,100,.16))}
.letter-dialog-gift-label{margin-top:6px;font-size:12px;color:#806a86;text-align:center}
.letter-dialog.closing{animation:dialogOut .48s ease forwards}
.letter-dialog-backdrop.closing{animation:dialogBackdropOut .48s ease forwards}
@keyframes letterFloat{50%{transform:translateY(-7px) rotate(.5deg)}}
@keyframes videoPageIn{0%{opacity:0;transform:scale(.985)}100%{opacity:1;transform:scale(1)}}
@keyframes dialogBackdropIn{0%{opacity:0}100%{opacity:1}}
@keyframes dialogBackdropOut{to{opacity:0}}
@keyframes dialogIn{0%{opacity:0;transform:translateY(28px) scale(.96) rotateX(3deg)}100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}}
@keyframes dialogOut{to{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes giftBounceLarge{50%{transform:translateY(-8px) scale(1.09) rotate(-2deg)}}
@media(max-width:600px){.letter-dialog{max-height:94svh;padding:16px 14px 22px;border-radius:24px}.letter-dialog-title{font-size:29px;margin-top:6px}.letter-dialog-paper{padding:24px 16px 22px;border-radius:20px}.letter-dialog .letter-content{font-size:14px;line-height:1.7}.letter-envelope-only{width:230px;height:162px}.letter-envelope-only .envelope-fold-left{border-width:0 103px 84px 0}.letter-envelope-only .envelope-fold-right{border-width:84px 103px 0 0}}


/* Final refinements: Page 5 / 6 / 8 / 9 */
.age-candle-wrap{width:92px;height:116px;top:-8px;align-items:flex-end;transition:opacity .32s,transform .32s;z-index:20}
.age-candle{width:48px;height:78px;border-radius:9px;background:linear-gradient(145deg,#fff 0%,#f0e7f8 42%,#a98bc8 100%);box-shadow:inset -5px 0 rgba(70,40,100,.10),0 10px 20px rgba(65,42,78,.18);font-size:22px;letter-spacing:.2px;text-shadow:0 2px 3px rgba(65,42,78,.28);border:2px solid rgba(141,115,189,.28)}
.age-candle:before{top:-7px;width:4px;height:9px}
.age-flame{top:-31px!important}
.age-smoke{top:-38px!important}
.age-candle-wrap:hover .age-candle{transform:translateY(-2px) scale(1.03)}
.birthday-celebration-card{width:min(100%,420px)!important;padding:30px 20px 28px!important}
.birthday-title{position:relative;filter:drop-shadow(0 0 10px rgba(166,93,126,.16));text-shadow:0 0 20px rgba(117,106,152,.15);animation:birthdayGlowIn 1.1s cubic-bezier(.2,.8,.2,1) both,birthdayGlow 2.6s 1.2s ease-in-out infinite alternate}
.birthday-title .birthday-main{font-size:.62em;letter-spacing:2.5px}
.birthday-title .birthday-name{font-size:1.28em;letter-spacing:.7px}
@keyframes birthdayGlowIn{0%{opacity:0;transform:translateY(40px) scale(.78);filter:blur(8px) drop-shadow(0 0 0 rgba(166,93,126,0))}70%{opacity:1;transform:translateY(-4px) scale(1.04);filter:blur(0) drop-shadow(0 0 18px rgba(166,93,126,.22))}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0) drop-shadow(0 0 10px rgba(166,93,126,.16))}}
@keyframes birthdayGlow{0%{text-shadow:0 0 8px rgba(166,93,126,.08)}100%{text-shadow:0 0 22px rgba(117,106,152,.28)}}
.birthday-photo-frame{position:relative;width:min(100%,320px);margin:0 auto 22px;padding:11px;border-radius:28px;background:linear-gradient(145deg,#f9eff6,#e9e5f5 48%,#dfeaf8);box-shadow:0 22px 52px rgba(73,51,83,.20),inset 0 0 0 2px rgba(255,255,255,.85),inset 0 0 0 6px rgba(147,112,151,.10);transform:perspective(900px) rotateY(-3deg);animation:birthdayFrameIn .9s .25s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
.birthday-photo-frame:before{content:'SAKSHI • BIRTHDAY';position:absolute;top:16px;left:16px;z-index:3;padding:5px 9px;border-radius:999px;background:rgba(42,33,49,.54);color:#fff;font-size:9px;letter-spacing:1.2px;font-weight:700}
.birthday-photo-frame:after{content:'';position:absolute;inset:7px;border:1px solid rgba(255,255,255,.62);border-radius:22px;pointer-events:none}
.birthday-photo-frame .birthday-photo{width:100%;max-height:390px;margin:0;border-radius:20px;object-fit:contain;background:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.72)}
@keyframes birthdayFrameIn{0%{opacity:0;transform:perspective(900px) rotateY(-14deg) translateY(18px) scale(.88)}100%{opacity:1;transform:perspective(900px) rotateY(-3deg) translateY(0) scale(1)}}
.scratch-next-wrap{opacity:0;visibility:hidden;transform:translateY(12px) scale(.94);pointer-events:none;transition:opacity .35s,transform .35s,visibility .35s;margin-top:14px}
.scratch-page.scratch-revealed .scratch-next-wrap{visibility:visible;pointer-events:auto;animation:scratchNextIn .7s .25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes scratchNextIn{0%{opacity:0;transform:translateY(16px) scale(.92)}60%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
.scratch-frame:before{content:'Original Pic'!important}
.scratch-page.scratch-revealed .scratch-frame{animation:scratchRevealFrame .9s cubic-bezier(.2,.8,.2,1) both}
.letter-page-only{width:min(100%,450px)!important;padding:30px 20px 32px!important;max-height:calc(100svh - 40px)!important;overflow:hidden!important}
.letter-page-only .success-title{font-size:29px!important;margin-bottom:28px!important}
.letter-envelope-only{width:290px;height:205px;margin:0 auto;animation:letterFloat 2.6s ease-in-out infinite,letterGlow 2.8s ease-in-out infinite alternate;filter:drop-shadow(0 24px 30px rgba(89,65,105,.22));perspective:1100px}
.letter-envelope-only .letter-envelope-back{left:10px;right:10px;bottom:10px;height:162px;border-radius:16px;background:linear-gradient(145deg,#fffdfb,#f0e4ee);box-shadow:inset 0 0 0 1px rgba(140,110,140,.09),0 10px 22px rgba(89,65,105,.09)}
.letter-envelope-only .letter-paper-preview{display:none}
.letter-envelope-only .envelope-fold-left{left:10px;border-width:0 135px 104px 0;border-color:transparent #f2e5ef transparent transparent}
.letter-envelope-only .envelope-fold-right{right:10px;border-width:104px 135px 0 0;border-color:#e9dbe8 transparent transparent transparent}
.letter-envelope-only .envelope-flap-only{left:10px;right:10px;top:26px;height:116px;border-top-left-radius:16px;border-top-right-radius:16px;background:linear-gradient(145deg,#dfbfd5,#f3ddea 55%,#e8cfe0);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.letter-seal{top:97px;width:46px;height:46px;font-size:19px;background:linear-gradient(145deg,#b86f93,#806a9a);box-shadow:0 9px 22px rgba(90,60,100,.24),0 0 0 5px rgba(255,255,255,.48),0 0 0 7px rgba(184,111,147,.10)}
.letter-tap{display:none!important}
@keyframes letterGlow{0%{filter:drop-shadow(0 18px 26px rgba(89,65,105,.18))}100%{filter:drop-shadow(0 20px 38px rgba(166,93,126,.30))}}
.letter-video-full{position:fixed!important;inset:0!important;z-index:999!important;background:rgba(12,9,16,.96)!important;display:grid!important;place-items:center!important;padding:12px!important}
.letter-video-full video{width:min(96vw,1280px)!important;height:min(94svh,920px)!important;max-width:none!important;max-height:none!important;object-fit:contain!important;border-radius:18px!important;background:#000!important;box-shadow:0 28px 90px rgba(0,0,0,.58)!important}
.letter-dialog-backdrop{position:fixed!important;inset:0!important;z-index:1000!important;padding:12px!important}
.letter-dialog{width:min(96vw,820px)!important;max-height:94svh!important;padding:20px 18px 28px!important;border-radius:30px!important}
.letter-dialog-paper{width:min(100%,700px)!important;border-radius:24px!important;padding:30px 24px 28px!important;box-shadow:0 18px 42px rgba(70,50,70,.14),inset 0 0 0 1px rgba(160,125,160,.12)!important}
.letter-dialog-title{font-size:36px!important;animation:dialogTitleIn .75s cubic-bezier(.2,.8,.2,1) both}
.letter-dialog .letter-content{animation:letterContentIn .8s .1s cubic-bezier(.2,.8,.2,1) both}

  o.type='square';o.frequency.setValueAtTime(1050,ac.currentTime);o.frequency.exponentialRampToValueAtTime(220,ac.currentTime+.12);
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);

function initScratchPage(){
 const wrap=document.getElementById('scratchWrap'), canvas=document.getElementById('scratchCanvas');
 if(!wrap||!canvas) return;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 const dpr=Math.min(window.devicePixelRatio||1,2);
 const rect=wrap.getBoundingClientRect();
 canvas.width=Math.floor(rect.width*dpr); canvas.height=Math.floor(rect.height*dpr);
 ctx.scale(dpr,dpr);
 const w=rect.width,h=rect.height;
 const grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#8c8695');grad.addColorStop(.5,'#d7d1dc');grad.addColorStop(1,'#777080');
 ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 for(let i=0;i<520;i++){
  const x=Math.random()*w,y=Math.random()*h,r=Math.random()*1.4+.2;
  ctx.fillStyle='rgba(255,255,255,'+(Math.random()*.18+.05)+')';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
 }
 ctx.fillStyle='rgba(52,45,60,.22)';ctx.font='700 18px DM Sans';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SCRATCH HERE',w/2,h/2);
 let drawing=false,lastX=0,lastY=0,done=false;
 function point(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top};}
 function scratch(e){if(done)return;e.preventDefault();const p=point(e);ctx.globalCompositeOperation='destination-out';ctx.lineWidth=38;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(lastX||p.x,lastY||p.y);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;checkScratch();}
 function begin(e){drawing=true;const p=point(e);lastX=p.x;lastY=p.y;scratch(e);}
 function end(){drawing=false;lastX=lastY=0;}
 canvas.addEventListener('pointerdown',begin,{passive:false});
 canvas.addEventListener('pointermove',e=>{if(drawing)scratch(e)},{passive:false});
 window.addEventListener('pointerup',end,{passive:true});
 function checkScratch(){
  const sw=Math.max(1,Math.floor(canvas.width/6)),sh=Math.max(1,Math.floor(canvas.height/6));
  const tmp=document.createElement('canvas');tmp.width=sw;tmp.height=sh;
  const tc=tmp.getContext('2d');tc.drawImage(canvas,0,0,sw,sh);
  const data=tc.getImageData(0,0,sw,sh).data;let transparent=0,total=sw*sh;
  for(let i=3;i<data.length;i+=4) if(data[i]<80) transparent++;
  const pct=transparent/total;
  if(pct>=.50){
   done=true;
   const title=document.getElementById('scratchResultTitle');
   const sub=document.getElementById('scratchResultSub');
   const hint=document.getElementById('scratchHint');
   const page=document.getElementById('scratchPage');
   if(title) title.textContent='Woww😲, Birthday ke din tum kuchh jyada hi pyari lag rhi ho😁';
   if(sub) sub.remove();
   if(hint) hint.textContent='';
   if(page) page.classList.add('scratch-revealed');
   ctx.globalCompositeOperation='destination-out';
   ctx.clearRect(0,0,w,h);
   canvas.style.pointerEvents='none';
   canvas.style.opacity='0';
   setTimeout(()=>{canvas.style.display='none';},350);
  }
 }
}
