.candle{position:absolute;width:15px;height:58px;border-radius:6px;background:repeating-linear-gradient(135deg,#fff 0 7px,#8d73bd 7px 13px);z-index:5;box-shadow:inset -3px 0 rgba(70,40,100,.12)}.c1{left:53px;top:-7px}.c2{left:95px;top:-17px}.c3{left:137px;top:-7px}.flame{position:absolute;width:18px;height:27px;border-radius:60% 40% 60% 40%;background:radial-gradient(circle at 50% 68%,#fff7b0 0 22%,#ffc04d 23% 57%,#ff7048 58% 100%);filter:drop-shadow(0 0 9px rgba(255,166,60,.7));z-index:6;animation:flicker .55s infinite alternate}.f1{left:51px;top:-38px}.f2{left:93px;top:-48px}.f3{left:135px;top:-38px}.flame.off{animation:none;opacity:0;transform:translateY(10px) scale(.15);transition:.3s}.candle.off{opacity:.72}.smoke{position:absolute;width:9px;height:22px;border-radius:50%;background:linear-gradient(transparent,rgba(120,112,125,.42));filter:blur(1.5px);opacity:0;z-index:7}.smoke.s1{left:55px;top:-48px}.smoke.s2{left:97px;top:-58px}.smoke.s3{left:139px;top:-48px}.smoke.active{animation:smokeRise 1.25s ease-out forwards}@keyframes smokeRise{0%{opacity:0;transform:translate(0,8px) scale(.35)}20%{opacity:.55}55%{opacity:.3;transform:translate(7px,-16px) scale(1)}100%{opacity:0;transform:translate(-4px,-42px) scale(1.5)}}@keyframes flicker{to{transform:translateY(-3px) scale(.88) rotate(4deg)}}.cake-hint{font-size:13px;color:#766b7d;margin:0 0 15px}.knife{position:absolute;width:150px;height:28px;right:8px;top:58px;z-index:10;transform:translateX(190px) rotate(-25deg);transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}.knife.show{transform:translateX(0) rotate(-25deg)}.knife.cutting{animation:knifeCut .75s ease-in-out forwards}@keyframes knifeCut{0%{transform:translateX(0) rotate(-25deg)}45%{transform:translateX(-48px) translateY(28px) rotate(0deg)}100%{transform:translateX(-12px) translateY(15px) rotate(5deg)}}.knife-blade{position:absolute;left:0;top:2px;width:105px;height:20px;background:linear-gradient(#fff,#bfc4cf);clip-path:polygon(0 0,100% 50%,0 1 px;line-height:1.55;color:#62586b;margin:0 auto 18px}.selfie-btn{min-height:52px}.flash{position:fixed;inset:0;background:#fff;z-index:20;pointer-events:none;animation:flash .45s ease-out forwards}.camera-frame{position:relative;width:min(100%,330px);margin:0 auto 20px;padding:12px;border:7px solid #26212b;border-radius:28px;background:linear-gradient(145deg,#514759,#17131d);box-shadow:0 20px 45px rgba(40,28,48,.28),inset 0 0 0 2px rgba(255,255,255,.12);animation:cameraIn .8s cubic-bezier(.2,.8,.2,1) both}.camera-frame:before{content:'';position:absolute;left:18px;top:18px;width:10px;height:10px;border-radius:50%;background:#ff4d68;box-shadow:0 0 10px #ff4d68;z-index:3;animation:recordDot 1s infinite}.camera-frame:after{content:'PHOTO • 2026';position:absolute;right:16px;top:16px;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.48);color:#fff;font-size:9px;letter-spacing:1.2px;font-weight:700;z-index:3}.camera-frame .birthday-photo{width:100%;max-height:390px;margin:0;border:2px solid rgba(255,255,255,.25);border-radius:18px;object-fit:contain;background:#f8f6f8}.celebration-burst{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;overflow:hidden}.celebration-burst span{position:absolute;font-size:28px;animation:burst 1.8s ease-out infinite}.celebration-burst span:nth-child(1){left:10%;top:18%;animation-delay:.1s}.celebration-burst span:nth-child(2){left:78%;top:22%;animation-delay:.3s}.celebration-burst span:nth-child(3){left:18%;top:70%;animation-delay:.5s}.celebration-burst span:nth-child(4){right:12%;top:68%;animation-delay:.7s}.celebration-burst span:nth-child(5){left:48%;top:12%;animation-delay:.9s}@keyframes burst{0%{opacity:0;transform:scale(.3) translateY(20px)}25%{opacity:1}100%{opacity:0;transform:scale(1.25) translateY(-75px)}}.capture-flash{position:fixed;inset:0;background:#fff;z-index:100;pointer-events:none;animation:captureFlash .5s ease-out forwards}.capture-label{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.58);color:#fff;padding:6px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:1.4px;white-space:nowrap}@keyframes cameraIn{0%{opacity:0;transform:scale(.75) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes recordDot{50%{opacity:.35}}@keyframes captureFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}.celebrate{animation:celebrate .8s both}@keyframes riseTitle{0%{opacity:0;transform:translateY(80px) scale(.8)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes photoIn{0%{opacity:0;transform:scale(.82) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@keyframes celebrate{0%{opacity:0;transform:translateY(90px) scale(.75)}100%{opacity:1;transform:translateY(0) scale(1)}}.letter-page{width:min(100%,390px);max-height:calc(100svh - 40px);overflow-y:auto;margin:0;padding:28px 20px 30px;text-align:center;border-radius:30px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.14);animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}.letter-envelope{width:220px;height:150px;margin:12px auto 20px;position:relative;cursor:pointer;perspective:800px;animation:floatLetter 2.4s ease-in-out infinite}.envelope-body{position:absolute;inset:20px 0 0;border-radius:10px;background:linear-gradient(145deg,#fff,#f3e9f4);box-shadow:0 16px 35px rgba(89,65,105,.18);overflow:hidden}.envelope-flap{position:absolute;left:0;top:20px;width:220px;height:90px;clip-path:polygon(0 0,50% 100%,100% 0);background:linear-gradient(145deg,#e8cde0,#f8eaf3);transform-origin:top;transition:transform .8s cubic-bezier(.2,.8,.2,1);z-index:3}.letter-paper{position:absolute;left:15px;right:15px;top:42px;height:95px;border-radius:8px;background:#fffdf8;box-shadow:0 5px 18px rgba(70,50,70,.12);transition:transform .9s cubic-bezier(.2,.8,.2,1),top .9s;z-index:2}.letter-envelope.open .envelope-flap{transform:rotateX(180deg)}.letter-envelope.open .letter-paper{top:-20px;transform:translateY(-30px)}.letter-lines{padding:18px;color:#8a7185;font-size:11px;line-height:1.8}.letter-note{font-size:14px;color:#766b7d;margin:0 auto 20px}.letter-gift{margin-top:22px;font-size:34px;cursor:pointer;animation:giftBounce 1.2s infinite}.letter-gift-label{font-size:12px;color:#806a86;margin-top:4px}@keyframes riseTitle{0%{opacity:0;transform:translateY(80px) scale(.8)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes photoIn{0%{opacity:0;transform:scale(.82) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@keyframes floatLetter{50%{transform:translateY(-6px)}}@keyframes giftBounce{50%{transform:translateY(-6px) scale(1.05)}}.cut{animation:cutCake .65s forwards}@keyframes cutCake{0%{transform:scale(1)}50%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(0) rotate(8deg);opacity:0}}
.scratch-page,.gallery-page{width:min(100%,430px);max-height:calc(100svh - 40px);overflow-y:auto;margin:0;padding:26px 20px 28px;text-align:center;border-radius:32px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.16);animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}.scratch-title,.gallery-title{font-family:'Playfair Display',serif;font-size:27px;line-height:1.28;margin:0 auto 8px}.scratch-sub{font-size:14px;line-height:1.5;color:#766b7d;margin:0 auto 18px}.scratch-wrap{position:relative;width:min(100%,330px);aspect-ratio:3/4;margin:0 auto 20px;border-radius:24px;overflow:hidden;background:#f7f3f7;box-shadow:0 20px 45px rgba(40,28,48,.2);touch-action:none}.scratch-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f7f3f7}.scratch-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:crosshair;touch-action:none}.scratch-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;color:#fff;background:rgba(50,42,55,.72);padding:10px 16px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:.4px;pointer-events:none;transition:opacity .25s}.scratch-wrap.scratching .scratch-badge{opacity:0}.scratch-reveal{opacity:0;transform:translateY(20px) scale(.92);transition:.65s cubic-bezier(.2,.8,.2,1);font-family:'Playfair Display',serif;font-size:23px;line-height:1.3;margin:0 auto 18px}.scratch-reveal.show{opacity:1;transform:translateY(0) scale(1)}.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px auto}.gallery-frame{padding:9px 9px 24px;background:#fff;border-radius:7px;box-shadow:0 14px 28px rgba(70,50,70,.16);position:relative;animation:galleryIn .7s both}.gallery-frame:nth-child(2){transform:rotate(2deg);animation-delay:.08s}.gallery-frame:nth-child(3){transform:rotate(-2deg);animation-delay:.16s}.gallery-frame:nth-child(4){transform:rotate(1.5deg);animation-delay:.24s}.gallery-frame:nth-child(5){transform:rotate(-1.5deg);animation-delay:.32s}.gallery-frame:nth-child(6){transform:rotate(2deg);animation-delay:.4s}.gallery-frame:nth-child(7){transform:rotate(-2deg);animation-delay:.48s}.gallery-frame img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;display:block}.gallery-frame:after{content:'Sakshi ♥';position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:10px;color:#806a86;font-weight:700}@keyframes galleryIn{0%{opacity:0;transform:translateY(30px) scale(.92) rotate(0)}100%{opacity:1}}.gallery-note{font-size:14px;line-height:1.5;color:#766b7d;margin:0 auto 16px}.gallery-page .actions{margin-top:8px}
.question{font-size:15px;line-height:1.55;color:#62586b;margin:0 auto 20px;max-width:320px}
.actions{display:flex;gap:12px;width:min(100%,330px);margin:6px auto 0;align-items:stretch;justify-content:center}
.action,.actions button.action{appearance:none!important;-webkit-appearance:none!important;min-height:50px!important;padding:0 16px;border:1px solid rgba(255,255,255,.55);border-radius:16px;font:700 14px 'DM Sans',sans-serif;letter-spacing:.1px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#92718c,#756a98);box-shadow:0 10px 24px rgba(117,106,152,.20);transition:transform .15s,box-shadow .15s,filter .15s;display:flex!important;align-items:center!important;justify-content:center!important;flex:1 1 0!important;width:auto!important;height:50px!important;white-space:nowrap;outline:none}
.action:hover{filter:brightness(1.03);box-shadow:0 11px 28px rgba(117,106,152,.24);transform:translateY(-1px)}

.actions .action{margin:0}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#92718c;animation:float 1.8s ease-out forwards;opacity:0}
.s1{top:27%;left:17%;animation-delay:.05s}.s2{top:21%;right:20%;animation-delay:.18s}.s3{top:37%;right:10%;animation-delay:.3s}.s4{top:16%;left:32%;animation-delay:.42s}.s5{top:44%;left:8%;animation-delay:.56s}

/* Letter video + final scratch-card page */
.letter-video-page{width:min(100%,390px);max-height:calc(100svh - 40px);overflow-y:auto;padding:22px 18px 26px;border-radius:30px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.16);text-align:center;animation:cardIn .55s ease both}

.letter-video-wrap video{display:block;width:100%;max-height:68svh;object-fit:contain;background:#000}
.letter-video-note{font-size:13px;color:#756b7d;margin:0}
.letter-content{font-size:14px;line-height:1.7;color:#4e4655;text-align:left;padding:4px 2px 12px}
.letter-content .letter-head{text-align:left;font-family:'Playfair Display',serif;font-size:25px;line-height:1.25;margin:0 0 16px;color:#4a3d4e}
.letter-content p{margin:0 0 13px}
.letter-content .poem{white-space:pre-line;margin:10px 0 18px;padding:16px 14px;border-radius:18px;background:linear-gradient(145deg,rgba(255,248,252,.95),rgba(246,241,255,.9));box-shadow:inset 0 0 0 1px rgba(160,125,160,.12)}
.letter-content .sign{text-align:right;margin-top:18px}

.scratch-message.reveal{animation:scratchReveal .85s cubic-bezier(.2,.8,.2,1) forwards}

<body>
<main class="wrap" id="app">
<section class="card" id="card">
<div class="kicker">A little surprise awaits... lekin usse pahle confirm karo</div>
<h1>Kahin tum chor to nhi... mere gifts lootne aaye ho🙄</h1>
<p class="sub">Kyoki ye gifts ek special person ke liye hai☺️</p>
<div class="gifbox"><img src="https://media.tenor.com/wL72VlC1_toAAAAj/robber-stealing.gif" alt="Robber GIF"></div>
<div class="label">Passcode enter karo</div>

<div class="keypad">
<button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
<button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
<button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
<button class="key clear" id="clear">Clear</button><button class="key" data-n="0">0</button><button class="key enter" id="enter">Open</button>
</div>

</section>
</main>
<script>
const pass='0610';let value='';
const teddyGif='https://media1.tenor.com/m/wqgKuRHvUkMAAAAd/zavarius-zavarius-teddy.gif';
const sadGifPost='15379003861890206930';
const app=document.getElementById('app'),dots=document.getElementById('dots'),msg=document.getElementById('msg'),card=document.getElementById('card');
function render(){dots.innerHTML='';for(let i=0;i<4;i++){const d=document.createElement('span');d.className='dot'+(i<value.length?' on':'');dots.appendChild(d)}}
function wrong(){msg.textContent='Wrong passcode! Dobara try karo 😌';msg.style.color='#a15c73';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');value='';render()}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(value.length<4){value+=b.dataset.n;render()}})
document.getElementById('clear').onclick=()=>{value='';msg.textContent='';render()}
document.getElementById('enter').onclick=check;
function check(){
 if(value!==pass){wrong();return}
 msg.style.color='#6b7d67';msg.textContent='Correct! Surprise unlocked...';
 card.classList.add('fade-out');
 setTimeout(showNextPage,430);
}
function basePage(inner){
 app.className='success-screen';
 app.style.cssText='width:100%;height:100dvh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px;position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;z-index:5;';
 app.innerHTML='<span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span><section class="success-card">'+inner+'</section>';
}
function showNextPage(){
 basePage(
 '<div class="success-icon">✓</div>'+
 '<h1 class="success-title">Good!!! Mujhe pta hi tha tum chor nhi ho tum to gaay ho😁</h1>'+
 '<img class="cow" src="assets/cow-chewing.gif?v=2" alt="Funny cow chewing GIF" loading="eager" decoding="async">'+
 '<p class="question">Maine tumhare liye kuchh banaya kya tum dekhna chahoge🤔</p>'+
 '<div class="actions"><button class="action" id="showBtn">haan dikhao</button><button class="action" id="noBtn">Mujhe nhi dekhna</button></div>'
 );
 document.getElementById('showBtn').onclick=showSurprisePage;
 document.getElementById('noBtn').onclick=showNoPage;
}
function showSurprisePage(){
 basePage(
 '<h1 class="success-title">Mai surprise dun aur tum na dekhna chaho aisa kaise ho skta hai☺️</h1>'+
 '<div class="gifbox"><img src="'+teddyGif+'" alt="Teddy GIF" loading="eager"></div>'+
  '<div class="actions"><button class="action" id="openSurprise">Open The Surprise</button></div>'
 );
 document.getElementById('openSurprise').onclick=showCakePage;
}
function showCakePage(){
 basePage(
 '<section class="cake-page">'+
 '<h1 class="cake-title">Aaj tumhara birthday hai chalo cake cut karke celebrate karte hai🥳</h1>'+
 '<div class="cake-stage" id="cakeStage">'+
 '<div class="cake" id="cake">'+
 '<div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div>'+
 '<div class="candle c1"></div><div class="candle c2"></div><div class="candle c3"></div>'+
 '<div class="smoke s1"></div><div class="smoke s2"></div><div class="smoke s3"></div>'+
 '<div class="cake-top"></div><div class="cream"></div><div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="cake-base"></div><div class="cut-line"></div>'+
 '</div>'+
 '<div class="knife" id="knife" title="Cake cut karo"><div class="knife-blade"></div><div class="knife-handle"></div></div>'+
 '</div>'+
 '<div class="actions"><button class="action" id="blowBtn">Mombatti Bujhao 💨</button></div>'+
 '<p class="knife-label" id="knifeLabel">Pehle mombatti bujhao</p>'+
 '</section>'
 );
 startBirthdayMusic();
 document.getElementById('blowBtn').onclick=blowCandles;
}
function blowCandles(){
 const cake=document.getElementById('cake'), btn=document.getElementById('blowBtn'), knife=document.getElementById('knife');
 if(!cake||cake.dataset.blown) return;
 cake.dataset.blown='1';
 const old=document.getElementById('birthdayMusic'); if(old) old.remove();
 const audio=document.createElement('audio'); audio.id='birthdayMusic'; audio.src='assets/happy-birthday-to-you.m4a'; audio.loop=true; audio.preload='auto'; audio.volume=.9; document.body.appendChild(audio);
 audio.play().catch(()=>{});
 document.querySelectorAll('.flame').forEach(x=>x.classList.add('off'));
 document.querySelectorAll('.candle').forEach(x=>x.classList.add('off'));
 document.querySelectorAll('.smoke').forEach(x=>x.classList.add('active'));
 btn.disabled=true; btn.style.pointerEvents='none'; btn.style.opacity='0'; btn.style.transform='translateY(8px) scale(.92)'; btn.style.transition='opacity .35s ease, transform .35s ease';
 setTimeout(()=>{btn.remove();knife.classList.add('show');knife.onclick=cutCake;},380);
}
function cutCake(){
 const cake=document.getElementById('cake'), knife=document.getElementById('knife');
 if(!cake||cake.dataset.cut) return;
 cake.dataset.cut='1';
 if(knife) knife.classList.add('cutting');
 setTimeout(()=>cake.classList.add('cut'),180);
 setTimeout(showBirthdayCelebration,1050);
}
function showBirthdayCelebration(){
 app.className='success-screen';
 app.innerHTML='<div class="celebration-burst"><span>🎉</span><span>✨</span><span>🎊</span><span>✨</span><span>🎉</span></div><div class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
 '<section class="success-card celebrate">'+
 '<div class="birthday-title">Happy Birthday Sakshi</div>'+
 '<img class="birthday-photo" src="assets/sakshi-selfie.jpg" alt="Sakshi">'+
 '<p class="selfie-copy">Chalo ab iss yaadgaar pal ki ek photo le lete hai😁</p>'+
 '<div class="actions"><button class="action selfie-btn" id="selfieBtn">Selfie</button></div>'+
 '</section>';

}
function startBirthdayMusic(){}
function playCaptureSound(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
  o.type='square';o.frequency.setValueAtTime(1050,ac.currentTime);o.frequency.exponentialRampToValueAtTime(220,ac.currentTime+.12);
  g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.18,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18);
  setTimeout(()=>ac.close(),350);
 }catch(e){}
}
function showSelfiePage(){
 const music=document.getElementById('birthdayMusic'); if(music){try{music.pause()}catch(e){} music.remove();}
 app.className='success-screen';
 app.innerHTML='<section class="success-card celebrate smile-card"><div class="smile-title">SMILE PLEASE 😊</div><div class="smile-camera"><div class="lens"></div><div class="focus-corner tl"></div><div class="focus-corner tr"></div><div class="focus-corner bl"></div><div class="focus-corner br"></div></div><p class="selfie-copy">Ready? Photo click ho rahi hai... 📸</p></section>';
 setTimeout(captureSelfie,1500);
}
function captureSelfie(){
 playCaptureSound();
 const flash=document.createElement('div');flash.className='capture-flash';document.body.appendChild(flash);
 setTimeout(()=>flash.remove(),520);

}
function showScratchPage(){
 basePage(
 '<section class="scratch-page">'+
 '<h1 class="scratch-title">Tumhari original photo bina fiter ke hi click ho gya😁</h1>'+ 
 '<p class="scratch-sub">Scratch karke dekho shi aaya hai ya nhi</p>'+ 
 '<div class="scratch-wrap" id="scratchWrap"><img class="scratch-photo" src="assets/sakshi-selfie.jpg?v=5" alt="Sakshi original photo"><canvas class="scratch-canvas" id="scratchCanvas"></canvas><div class="scratch-badge">Scratch here</div></div>'+ 
 '<div class="scratch-reveal" id="scratchReveal">Woww😲, Birthday ke din tum kuchh jyada hi pyari lag rhi ho😁</div>'+ 
 '<div class="actions"><button class="action" id="scratchNext" style="opacity:0;pointer-events:none">Next</button></div>'+ 
 '</section>'
 );
 initScratch();
}
function initScratch(){
 const wrap=document.getElementById('scratchWrap'),canvas=document.getElementById('scratchCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),next=document.getElementById('scratchNext'),reveal=document.getElementById('scratchReveal');
 let drawing=false,done=false,cleared=0;
 function resize(){const r=wrap.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#d7c9d8';ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='rgba(255,255,255,.35)';for(let y=0;y<r.height;y+=22){ctx.fillRect(0,y,r.width,1)}}
 resize(); window.addEventListener('resize',resize,{once:true});
 function point(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
 function scratch(e){if(!drawing||done)return;e.preventDefault();const p=point(e);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.fill();check();}
 function check(){if(done)return;const d=Math.min(window.devicePixelRatio||1,2),data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let clear=0,total=0;const step=Math.max(1,Math.floor(8*d));for(let y=0;y<canvas.height;y+=step){for(let x=0;x<canvas.width;x+=step){const i=(y*canvas.width+x)*4;total++;if(data[i+3]<45)clear++;}}cleared=clear/total;if(cleared>=.60){done=true;ctx.clearRect(0,0,canvas.width/d,canvas.height/d);wrap.classList.add('scratching');reveal.classList.add('show');next.style.opacity='1';next.style.pointerEvents='auto';next.onclick=showLetterPage}}
 canvas.addEventListener('pointerdown',e=>{drawing=true;wrap.classList.add('scratching');scratch(e)});canvas.addEventListener('pointermove',scratch);window.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('touchstart',e=>{drawing=true;scratch(e)},{passive:false});canvas.addEventListener('touchmove',scratch,{passive:false});window.addEventListener('touchend',()=>drawing=false);
}
function showLetterPage(){
 basePage(
 '<section class="letter-page">'+
 '<h1 class="success-title">Tumhare liye ek special letter 💌</h1>'+ 
 '<div class="letter-envelope" id="letterEnvelope"><div class="letter-body envelope-body"></div><div class="letter-paper"><div class="letter-lines">Letter par click karo☺️</div></div><div class="envelope-flap"></div></div>'+ 
 '<p class="letter-note">Letter par click karo aur dekho andar kya hai☺️</p>'+ 
 '<div id="letterVideoWrap" style="display:none;margin:14px auto 18px"><video id="letterVideo" playsinline controls style="width:100%;max-height:320px;border-radius:18px;background:#000;box-shadow:0 14px 30px rgba(60,40,70,.16)"></video></div>'+ 
 '<div id="letterContent" style="display:none;text-align:left;font-size:14px;line-height:1.7;color:#4d4354;background:#fffdf8;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(70,50,70,.10)">'+
 '<p><b>Dear Sakshi,</b></p>'+ 
 '<p>Sabse pahle to Happy Birthday...</p>'+ 
 '<p>Haan haan pta hai bolne me late kar diya... Lekin isme bhi galati tumhari hi hai meri nhi... Khair chhoro aaj birthday hai tumhara... Isliye ladna nhi hai😁</p>'+ 
 '<p>Ummeed hai ab tak mere surprises tumhe pasand aa rhe honge... Nhi aa rhe hai to shayad aa jayega... Kuchh lines likhi hai tumhare uper... Usko dil per lena😁</p>'+ 
 '<p><b>Arz kiya hai—</b></p>'+ 
 '<p>Sakshi naam hai tumhara,<br>Par kaam tumhare niraale hain,<br>Seedhi-saadi sirf dikhne mein ho,<br>Karnaame tumhare naagin waale hain. 🐍</p>'+ 
 '<p>Apne Rajkumar ke sapne roz raat tumhe aate hain,<br>Koi manayega, koi ghumayega, Aise khwaab sataate hain,<br>Par ye baat bhool jaati ho,<br>Naagin se bhala ikraar koi kyun karega,<br>Patte kaatne mein jo sabse aage ho,<br>Tumse bhala pyaar koi kyun karega! 😁</p>'+ 
 '<p>Saari pehenna tumhe hai pasand,<br>Tumhe lagta hai achchi lagti ho,<br>Kabhi meri nazar se bhi dekh lo khud ko,<br>Kasam se churail lagti ho. 👻</p>'+ 
 '<p>Tum naagin ho, churail ho, dayan ho,<br>Khud ko inmein se koi ek mat samajhna,<br>Tum toh in sabki bhi amma ho,<br>Is sach se kabhi inkaar mat karna! 😁</p>'+ 
 '<p>Raaz tumhare hain bahut saare,<br>Batana toh bahut kuchh chahta hoon,<br>Batane baithun toh birthday nikal jaaye,<br>Aur likhne baithun toh, Agla birthday aa jaaye! 🙂</p>'+ 
 '<p>Lekin sach kahun,<br>Jitna bhi tumhe chidata hoon,<br>Tum gussa karo ya muh fulaao,<br>Tumhe pareshaan karke mai to khush ho jaata hoon. 😌</p>'+

 '<p>To kaisa laga mera meri likhi kavita... Pta hai chcha hi laga hoga thank you bolne ki jarurat nhi hai...</p>'+ 
 '<p>🎂 Cake tumhara hai<br>🎁 Gift tumhara hai<br>🥳 Birthday tumhara hai<br>💸 To party bhi tumhari taraf se hogi</p>'+

 '<p>Zindagi mein mile tumhe har woh mukaam,<br>Jiske liye tumne dekhe hain kabhi sapne tamaam. ✨<br>Tarakki tumhare kadam choome baar-baar,<br>Har naya din laaye khushiyon ki bahaar. 🌸<br>Jo chaaho woh tumhe milta rahe,<br>Har mushkil se tumhara hausla jeetta rahe.<br>Aur jab zindagi tumhe itni khushiyan de jaaye,<br>Toh meri party ka bhi intezaam ho jaaye! 😁<br>Tumhari hasi rahe hamesha yunhi barkaraar,<br>Khushiyon se bhara rahe tumhara sansaar. ❤️<br>Tum humesha khush rho,<br>Poori ho tumhari har khwaish,<br>Nhi chahiye mujhe paiso walo party,<br>Ek baar muskura do bas itni si hai farmaish.🥹</p>'+ 
 '<p>Bas bas ab itna bhi muskurane ki jarurat nhi... Jyda der tak dekha nhi jata humse😁</p>'+ 
 '<p>Aise hi mere gyan ki chhatra chhaya me apna dimag aur gyan viksit karte rho... Neeche tumhare liye ek last gift hai vo dekh ke jarur Jana.</p>'+ 
 '<p>—Tumhe bilkul preshan na karne wala dost😇</p>'+ 
 '</div>'+ 
 '<div class="letter-gift" id="letterGift">🎁</div><div class="letter-gift-label">Last surprise ke liye gift par click karna</div>'+ 
 '</section>'
 );
 const env=document.getElementById('letterEnvelope'),video=document.getElementById('letterVideo'),wrap=document.getElementById('letterVideoWrap'),content=document.getElementById('letterContent');
 env.onclick=function(){if(env.dataset.played)return;env.dataset.played='1';env.classList.add('open');wrap.style.display='block';video.src='assets/sakshi-letter-intro.mp4';video.play().catch(()=>{});video.onended=()=>{wrap.style.display='none';content.style.display='block';}};

}

 const yt='https://www.youtube.com/embed/2i3wIST4pBA?start=4&autoplay=1&loop=1&playlist=2i3wIST4pBA&controls=0&rel=0';

 '<div class="tenor-wrap"><div class="tenor-gif-embed" data-postid="'+sadGifPost+'" data-share-method="host" data-aspect-ratio="1" data-width="100%">'+
