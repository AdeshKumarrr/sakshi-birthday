<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sakshi — Birthday Surprise</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif}
body{background:linear-gradient(145deg,#fff8f1 0%,#f7efff 52%,#eef7ff 100%);color:#322b3d;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(1px);pointer-events:none;z-index:0}
body:before{width:220px;height:220px;background:#f8dfe9;opacity:.42;top:-80px;right:-70px}
body:after{width:260px;height:260px;background:#ddd6ff;opacity:.35;bottom:-120px;left:-100px}
.wrap{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(100%,390px);padding:30px 22px 24px;border:1px solid rgba(255,255,255,.8);border-radius:30px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.14);text-align:center}
.kicker{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#92758e;margin-bottom:12px}
h1{font-family:'Playfair Display',serif;font-size:27px;line-height:1.25;margin:0 auto 7px;max-width:340px}
.sub{font-size:14px;line-height:1.55;color:#756b7d;margin:0 auto 18px;max-width:310px}
.gifbox{width:190px;min-height:145px;margin:0 auto 18px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(84,61,93,.1);display:flex;align-items:center;justify-content:center}
.tenor-gif-embed{width:100%!important;max-width:100%!important}
.label{font-size:13px;font-weight:600;color:#716675;margin-bottom:9px}
.dots{display:flex;justify-content:center;gap:8px;margin:0 auto 16px}
.dot{width:10px;height:10px;border-radius:50%;background:#ddd5df;transition:.2s}
.dot.on{background:#806a86;transform:scale(1.1)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:285px;margin:0 auto}
.key{height:52px;border:0;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:0 5px 16px rgba(80,60,90,.08);font:600 18px 'DM Sans';color:#45394a;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.key:active{transform:scale(.94);box-shadow:0 2px 8px rgba(80,60,90,.08)}
.key.clear{font-size:13px;color:#92758e}
.key.enter{font-size:13px;color:#fff;background:linear-gradient(135deg,#92718c,#756a98)}
.msg{height:22px;font-size:12px;color:#a15c73;margin-top:12px;font-weight:600}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
@media(max-width:350px){.card{padding:25px 16px 20px}.gifbox{width:170px}.key{height:49px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card" id="card">
<div class="kicker">A little surprise awaits</div>
<h1>Kahin tum chor to nhi... mere gifts lootne aaye ho🙄</h1>
<p class="sub">Kyoki ye gifts ek special person ke liye hai☺️</p>
<div class="gifbox">
<div class="tenor-gif-embed" data-postid="13809659" data-share-method="host" data-aspect-ratio="1.04348" data-width="100%"><a href="https://tenor.com/view/robber-stealing-thief-robbery-money-thief-gif-13809659">Robber Stealing Sticker</a> from <a href="https://tenor.com/search/robber-stickers">Robber Stickers</a></div>
</div>
<div class="label">Passcode enter karo</div>
<div class="dots" id="dots"></div>
<div class="keypad">
<button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
<button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
<button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
<button class="key clear" id="clear">Clear</button><button class="key" data-n="0">0</button><button class="key enter" id="enter">Open</button>
</div>
<div class="msg" id="msg"></div>
</section>
</main>
<script>
const pass='0610';let value='';
const dots=document.getElementById('dots'),msg=document.getElementById('msg'),card=document.getElementById('card');
function render(){dots.innerHTML='';for(let i=0;i<4;i++){const d=document.createElement('span');d.className='dot'+(i<value.length?' on':'');dots.appendChild(d)}}
function wrong(){msg.textContent='Hmm... passcode sahi nahi hai 😌';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');value='';render()}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(value.length<4){value+=b.dataset.n;render();if(value.length===4)setTimeout(check,180)}})
document.getElementById('clear').onclick=()=>{value='';msg.textContent='';render()}
document.getElementById('enter').onclick=check;
function check(){if(value===pass){msg.style.color='#6b7d67';msg.textContent='Access granted...';setTimeout(()=>{document.body.innerHTML='<div style="min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center;font-family:DM Sans,sans-serif;background:linear-gradient(145deg,#fff8f1,#f7efff,#eef7ff)"><div><h2 style="font-family:Playfair Display,serif;font-size:30px;margin:0 0 10px">Perfect! ✨</h2><p style="color:#756b7d">Surprise unlocked.</p></div></div>'},450)}else wrong()}
render();
</script>
<script type="text/javascript" async src="https://tenor.com/embed.js"></script>
</body>
</html>
