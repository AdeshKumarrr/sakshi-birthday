<html lang="en">
<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.success-title{font-family:'Playfair Display',serif;font-size:27px;line-height:1.28;margin:0 auto 18px}
.cow{width:210px;height:155px;object-fit:contain;border-radius:20px;background:#fff;margin:0 auto 18px;box-shadow:0 10px 28px rgba(84,61,93,.1);image-rendering:auto;display:block}.tenor-wrap{width:210px;min-height:210px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center} .tenor-gif-embed{width:210px!important;max-width:210px!important;margin:0 auto!important}.cake-page{width:min(100%,430px);padding:26px 20px 28px;text-align:center;border-radius:32px;background:rgba(255,255,255,.84);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.16);animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}.cake-title{font-family:'Playfair Display',serif;font-size:25px;line-height:1.3;margin:0 auto 16px}.cake-stage{height:280px;display:grid;place-items:center;position:relative;margin:0 auto 4px;perspective:900px}.cake{position:relative;width:205px;height:150px;transform-style:preserve-3d;filter:drop-shadow(0 22px 20px rgba(72,45,70,.22));transition:.5s}.cake-base{position:absolute;left:10px;bottom:5px;width:185px;height:88px;border-radius:18px 18px 28px 28px;background:linear-gradient(100deg,#c95b82,#f59bb5 32%,#ffd0dc 58%,#d9688f);box-shadow:inset 0 8px 0 rgba(255,255,255,.34),inset 0 -12px 18px rgba(124,47,79,.18),8px 12px 0 #b64e74;transform:translateZ(14px)}.cake-top{position:absolute;left:10px;top:45px;width:185px;height:55px;border-radius:50%;background:radial-gradient(ellipse at 35% 25%,#fff7fa 0 12%,#ffd9e4 13% 52%,#e992ad 53% 100%);box-shadow:inset 0 -10px 0 rgba(196,80,119,.18),0 8px 0 rgba(182,78,116,.45);transform:translateZ(20px)}.cream{position:absolute;left:23px;top:75px;width:160px;height:26px;border-radius:0 0 18px 18px;background:linear-gradient(#fff,#ffeef4);z-index:2;transform:translateZ(23px)}.drip{position:absolute;top:78px;width:18px;height:30px;border-radius:0 0 12px 12px;background:#fff;z-index:3}.d1{left:39px}.d2{left:94px;height:38px}.d3{left:142px}.candle{position:absolute;width:15px;height:58px;border-radius:6px;background:repeating-linear-gradient(135deg,#fff 0 7px,#8d73bd 7px 13px);z-index:5;box-shadow:inset -3px 0 rgba(70,40,100,.12)}.c1{left:53px;top:-7px}.c2{left:95px;top:-17px}.c3{left:137px;top:-7px}.flame{position:absolute;width:18px;height:27px;border-radius:60% 40% 60% 40%;background:radial-gradient(circle at 50% 68%,#fff7b0 0 22%,#ffc04d 23% 57%,#ff7048 58% 100%);filter:drop-shadow(0 0 9px rgba(255,166,60,.7));z-index:6;animation:flicker .55s infinite alternate}.f1{left:51px;top:-38px}.f2{left:93px;top:-48px}.f3{left:135px;top:-38px}.flame.off{animation:none;opacity:0;transform:scale(.1) translateY(10px);transition:.35s}.candle.off{opacity:.7}@keyframes flicker{to{transform:translateY(-3px) scale(.88) rotate(4deg)}}.cake-hint{font-size:13px;color:#766b7d;margin:0 0 15px}.knife{position:absolute;width:150px;height:28px;right:8px;top:58px;z-index:10;transform:translateX(190px) rotate(-25deg);transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer}.knife.show{transform:translateX(0) rotate(-25deg)}.knife-blade{position:absolute;left:0;top:2px;width:105px;height:20px;background:linear-gradient(#fff,#bfc4cf);clip-path:polygon(0 0,100% 50%,0 100%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}.knife-handle{position:absolute;right:0;top:0;width:58px;height:25px;border-radius:8px 14px 14px 8px;background:linear-gradient(90deg,#3d3446,#16131b)}.knife-label{font-size:12px;color:#766b7d;margin:4px 0 0}.cut-line{position:absolute;left:50%;top:45px;width:5px;height:105px;background:rgba(255,255,255,.85);border-radius:10px;transform:translateX(-50%) scaleY(0);transform-origin:top;z-index:8}.cake.cut .cut-line{animation:cutline .55s .05s forwards}.cake.cut{animation:cakeCut .65s forwards}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:8px;height:16px;border-radius:3px;top:-20px;animation:confettiFall 1.8s linear infinite}.confetti i:nth-child(1){left:8%;background:#ef8eae;animation-delay:.05s}.confetti i:nth-child(2){left:22%;background:#8f79bd;animation-delay:.25s}.confetti i:nth-child(3){left:38%;background:#f2b94b;animation-delay:.4s}.confetti i:nth-child(4){left:55%;background:#70b8a0;animation-delay:.15s}.confetti i:nth-child(5){left:72%;background:#ef8eae;animation-delay:.5s}.confetti i:nth-child(6){left:89%;background:#8f79bd;animation-delay:.3s}@keyframes confettiFall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}@keyframes cutline{to{transform:translateX(-50%) scaleY(1)}}@keyframes cakeCut{0%{transform:scale(1) rotateY(0)}45%{transform:scale(1.05) rotateY(-7deg)}100%{transform:scale(.15) translateY(35px) rotate(8deg);opacity:0}}.birthday-title{font-family:'Playfair Display',serif;font-size:42px;line-height:1.08;margin:0 auto 20px;background:linear-gradient(135deg,#a65d7e,#756a98);-webkit-background-clip:text;background-clip:text;color:transparent;animation:riseTitle 1s cubic-bezier(.2,.8,.2,1) both}.birthday-photo{width:min(100%,300px);max-height:370px;object-fit:contain;border-radius:24px;box-shadow:0 18px 45px rgba(80,60,90,.18);animation:photoIn .9s .2s both;margin:0 auto 22px;display:block;background:#fff}.selfie-copy{font-size:15px;line-height:1.55;color:#62586b;margin:0 auto 18px}.selfie-btn{min-height:52px}.flash{position:fixed;inset:0;background:#fff;z-index:20;pointer-events:none;animation:flash .45s ease-out forwards}.camera-frame{position:relative}.camera-frame:after{content:'SELFIE';position:absolute;left:14px;bottom:14px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;letter-spacing:1.5px;font-weight:700}.celebrate{animation:celebrate .8s both}@keyframes riseTitle{0%{opacity:0;transform:translateY(80px) scale(.8)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes photoIn{0%{opacity:0;transform:scale(.82) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@keyframes celebrate{0%{opacity:0;transform:translateY(90px) scale(.75)}100%{opacity:1;transform:translateY(0) scale(1)}}.letter-page{width:min(100%,390px);padding:28px 20px 30px;text-align:center;border-radius:30px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(89,65,105,.14);animation:cardIn .65s cubic-bezier(.2,.8,.2,1)}.letter-envelope{width:220px;height:150px;margin:12px auto 20px;position:relative;cursor:pointer;perspective:800px;animation:floatLetter 2.4s ease-in-out infinite}.envelope-body{position:absolute;inset:20px 0 0;border-radius:10px;background:linear-gradient(145deg,#fff,#f3e9f4);box-shadow:0 16px 35px rgba(89,65,105,.18);overflow:hidden}.envelope-flap{position:absolute;left:0;top:20px;width:220px;height:90px;clip-path:polygon(0 0,50% 100%,100% 0);background:linear-gradient(145deg,#e8cde0,#f8eaf3);transform-origin:top;transition:transform .8s cubic-bezier(.2,.8,.2,1);z-index:3}.letter-paper{position:absolute;left:15px;right:15px;top:42px;height:95px;border-radius:8px;background:#fffdf8;box-shadow:0 5px 18px rgba(70,50,70,.12);transition:transform .9s cubic-bezier(.2,.8,.2,1),top .9s;z-index:2}.letter-envelope.open .envelope-flap{transform:rotateX(180deg)}.letter-envelope.open .letter-paper{top:-20px;transform:translateY(-30px)}.letter-lines{padding:18px;color:#8a7185;font-size:11px;line-height:1.8}.letter-note{font-size:14px;color:#766b7d;margin:0 auto 20px}.letter-gift{margin-top:22px;font-size:34px;cursor:pointer;animation:giftBounce 1.2s infinite}.letter-gift-label{font-size:12px;color:#806a86;margin-top:4px}@keyframes riseTitle{0%{opacity:0;transform:translateY(80px) scale(.8)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes photoIn{0%{opacity:0;transform:scale(.82) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}@keyframes floatLetter{50%{transform:translateY(-6px)}}@keyframes giftBounce{50%{transform:translateY(-6px) scale(1.05)}}.cut{animation:cutCake .65s forwards}@keyframes cutCake{0%{transform:scale(1)}50%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(0) rotate(8deg);opacity:0}}
.question{font-size:15px;line-height:1.55;color:#62586b;margin:0 auto 20px;max-width:320px}
.actions{display:grid;gap:11px;max-width:300px;margin:auto}
.action{min-height:52px;border:0;border-radius:17px;font:700 14px 'DM Sans';cursor:pointer;color:#fff;background:linear-gradient(135deg,#92718c,#756a98);box-shadow:0 9px 24px rgba(117,106,152,.2);transition:transform .15s,box-shadow .15s,filter .15s}
.action:hover{filter:brightness(1.03);box-shadow:0 11px 28px rgba(117,106,152,.24)}
.action:active{transform:scale(.96)}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#92718c;animation:float 1.8s ease-out forwards;opacity:0}
.s1{top:27%;left:17%;animation-delay:.05s}.s2{top:21%;right:20%;animation-delay:.18s}.s3{top:37%;right:10%;animation-delay:.3s}.s4{top:16%;left:32%;animation-delay:.42s}.s5{top:44%;left:8%;animation-delay:.56s}
@keyframes float{0%{transform:translateY(20px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-80px) scale(1.25);opacity:0}}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(28px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
.fade-out{animation:fadeOut .42s forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.97)}}
@media(max-width:350px){.card{padding:25px 16px 20px}.gifbox{width:170px;height:130px}.key{height:49px}.cow{width:190px;height:140px}}
</style>

<body>
<main class="wrap" id="app">
<section class="card" id="card">
<div class="kicker">A little surprise awaits... lekin usse pahle confirm karo</div>
<h1>Kahin tum chor to nhi... mere gifts lootne aaye ho🙄</h1>
<p class="sub">Kyoki ye gifts ek special person ke liye hai☺️</p>
<div class="gifbox"><img src="https://media.tenor.com/wL72VlC1_toAAAAj/robber-stealing.gif" alt="Robber GIF"></div>
<div class="label">Passcode enter karo</div>
<div class="dots" id="dots"></div>
<div class="keypad">
<button class="key" data-n="1">1</button><button class="key" data-n="2">2</button><button class="key" data-n="3">3</button>
<button class="key" data-n="4">4</button><button class="key" data-n="5">5</button><button class="key" data-n="6">6</button>
<button class="key" data-n="7">7</button><button class="key" data-n="8">8</button><button class="key" data-n="9">9</button>
<button class="key clear" id="clear">Clear</button><button class="key" data-n="0">0</button><button class="key enter" id="enter">Open</button>
</div>
<div class="msg" id="msg"></div>
</section>
</main>
<script>
const pass='0610';let value='';
const teddyGif='https://media1.tenor.com/m/wqgKuRHvUkMAAAAd/zavarius-zavarius-teddy.gif';
const sadGifPost='15379003861890206930';
const app=document.getElementById('app'),dots=document.getElementById('dots'),msg=document.getElementById('msg'),card=document.getElementById('card');
function render(){dots.innerHTML='';for(let i=0;i<4;i++){const d=document.createElement('span');d.className='dot'+(i<value.length?' on':'');dots.appendChild(d)}}
function wrong(){msg.textContent='Wrong passcode! Dobara try karo 😌';msg.style.color='#a15c73';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');value='';render()}
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{if(value.length<4){value+=b.dataset.n;render()}})
document.getElementById('clear').onclick=()=>{value='';msg.textContent='';render()}
document.getElementById('enter').onclick=check;
function check(){
 if(value!==pass){wrong();return}
 msg.style.color='#6b7d67';msg.textContent='Correct! Surprise unlocked...';
 card.classList.add('fade-out');
 setTimeout(showNextPage,430);
}
function basePage(inner){
 app.className='success-screen';
 app.innerHTML='<span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span><section class="success-card">'+inner+'</section>';
}
function showNextPage(){
 basePage(
 '<div class="success-icon">✓</div>'+
 '<h1 class="success-title">Good!!! Mujhe pta hi tha tum chor nhi ho tum to gaay ho😁</h1>'+
 '<img class="cow" src="assets/cow-chewing.gif" alt="Funny cow chewing GIF" loading="eager" decoding="async">'+
 '<p class="question">Maine tumhare liye kuchh banaya kya tum dekhna chahoge🤔</p>'+
 '<div class="actions"><button class="action" id="showBtn">haan dikhao</button><button class="action" id="noBtn">Mujhe nhi dekhna</button></div>'
 );
 document.getElementById('showBtn').onclick=showSurprisePage;
 document.getElementById('noBtn').onclick=showNoPage;
}
function showSurprisePage(){
 basePage(
 '<h1 class="success-title">Surprise tumhara wait kar raha hai☺️</h1>'+
 '<div class="gifbox"><img src="'+teddyGif+'" alt="Teddy GIF" loading="eager"></div>'+
 '<p class="question">Mai surprise dun aur tum na dekhna chaho aisa kaise ho skta hai☺️</p>'+
 '<div class="actions"><button class="action" id="openSurprise">Open The Surprise</button></div>'
 );
 document.getElementById('openSurprise').onclick=showCakePage;
}
function showCakePage(){
 basePage(
 '<section class="cake-page">'+
 '<h1 class="cake-title">Aaj tumhara birthday hai chalo cake cut karke celebrate karte hai🥳</h1>'+
 '<div class="cake-stage" id="cakeStage">'+
 '<div class="cake" id="cake">'+
 '<div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div>'+
 '<div class="candle c1"></div><div class="candle c2"></div><div class="candle c3"></div>'+
 '<div class="cake-top"></div><div class="cream"></div><div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div><div class="cake-base"></div><div class="cut-line"></div>'+
 '</div>'+
 '<div class="knife" id="knife" title="Cake cut karo"><div class="knife-blade"></div><div class="knife-handle"></div></div>'+
 '</div>'+
 '<div class="actions"><button class="action" id="blowBtn">Mombatti Bujhao 🕯️</button></div>'+
 '<p class="knife-label" id="knifeLabel">Pehle mombatti bujhao</p>'+
 '</section>'
 );
 startBirthdayMusic();
 document.getElementById('blowBtn').onclick=blowCandles;
}
function blowCandles(){
 const cake=document.getElementById('cake'), btn=document.getElementById('blowBtn'), knife=document.getElementById('knife'), label=document.getElementById('knifeLabel');
 if(!cake||cake.dataset.blown) return;
 cake.dataset.blown='1';
 document.querySelectorAll('.flame').forEach(x=>x.classList.add('off'));
 document.querySelectorAll('.candle').forEach(x=>x.classList.add('off'));
 btn.textContent='Candle Bujh Gayi ✓';
 btn.disabled=true;btn.style.opacity='.65';
 setTimeout(()=>{knife.classList.add('show');label.textContent='Ab chaku par click karke cake cut karo 🔪';knife.onclick=cutCake;},700);
}
function cutCake(){
 const cake=document.getElementById('cake');
 if(!cake||cake.dataset.cut) return;
 cake.dataset.cut='1';cake.classList.add('cut');
 setTimeout(showBirthdayCelebration,650);
}
function showBirthdayCelebration(){
 const music=document.getElementById('birthdayMusic'); if(music) music.remove();
 app.className='success-screen';
 app.innerHTML='<div class="confetti"><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
 '<section class="success-card celebrate">'+
 '<div class="birthday-title">Happy Birthday Sakshi</div>'+
 '<img class="birthday-photo" src="assets/sakshi-selfie.jpg" alt="Sakshi">'+
 '<p class="selfie-copy">Chalo ab iss yaadgaar pal ki ek photo le lete hai😁</p>'+
 '<div class="actions"><button class="action selfie-btn" id="selfieBtn">Selfie</button></div>'+
 '</section>';
 document.getElementById('selfieBtn').onclick=showSelfiePage;
}
function startBirthdayMusic(){
 const old=document.getElementById('birthdayMusic'); if(old) old.remove();
 const iframe=document.createElement('iframe');
 iframe.id='birthdayMusic';iframe.src='https://www.youtube.com/embed/2i3wIST4pBA?start=6&autoplay=1&loop=1&playlist=2i3wIST4pBA&controls=0&rel=0';
 iframe.allow='autoplay; encrypted-media';iframe.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;bottom:-10px;border:0';
 document.body.appendChild(iframe);
}
function showSelfiePage(){
 const flash=document.createElement('div');flash.className='flash';document.body.appendChild(flash);
 setTimeout(()=>flash.remove(),450);
 basePage(
 '<h1 class="success-title">Woww😲... Apne birthday per kitni pyari lag rhi ho😁</h1>'+
 '<div class="camera-frame"><img class="birthday-photo" src="assets/sakshi-selfie.jpg" alt="Sakshi selfie"></div>'+
 '<p class="selfie-copy">Chalo ab mere andaaj me mai tumhe wish kar deta hun next per click karo aur letter ko open karo..</p>'+
 '<div class="actions"><button class="action" id="nextLetter">Next</button></div>'
 );
 document.getElementById('nextLetter').onclick=showLetterPage;
}
function showLetterPage(){
 basePage(
 '<section class="letter-page">'+
 '<h1 class="success-title">Tumhare liye ek special letter 💌</h1>'+
 '<div class="letter-envelope" id="letterEnvelope">'+
 '<div class="letter-body envelope-body"></div>'+
 '<div class="letter-paper"><div class="letter-lines">Yahan tumhare liye ek special message hoga...<br>Thoda sa wait karo, letter open karo☺️</div></div>'+
 '<div class="envelope-flap"></div>'+
 '</div>'+
 '<p class="letter-note">Letter par click karo aur dekho andar kya hai☺️</p>'+
 '<div class="letter-gift" id="letterGift">🎁</div><div class="letter-gift-label">Last surprise ke liye gift par click karna</div>'+
 '</section>'
 );
 document.getElementById('letterEnvelope').onclick=function(){
   this.classList.toggle('open');
 };
}
function showNoPage(){
 basePage(
 '<div class="success-icon">🥺</div>'+
 '<div class="tenor-wrap"><div class="tenor-gif-embed" data-postid="'+sadGifPost+'" data-share-method="host" data-aspect-ratio="1" data-width="100%">'+
 '<a href="https://tenor.com/view/do-bronx-gif-15379003861890206930" target="_blank" rel="noopener">Do Bronx GIF</a>'+
 '</div></div>'+
 '<p class="question">Maine bahut mehnat se banaya hai🥺</p>'+
 '<div class="actions"><button class="action" id="showGoodBtn">Achcha dikha do</button><button class="action" id="hideNoBtn">Phir bhi nhi dekhna</button></div>'
 );
 loadTenor();
